services:
  - type: web
    name: cropsense-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Paste your Neon PostgreSQL URL here
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure value
      - key: HF_REPO_ID
        sync: false          # e.g. "yourname/cropsense-model"
      - key: FRONTEND_URL
        sync: false          # e.g. "https://cropsense.vercel.app"
      - key: USE_TFLITE
        value: "true"        # Use lightweight TFLite model on Render
